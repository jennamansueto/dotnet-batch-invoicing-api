# Contoso.Invoicing Build Pipeline (.NET 8)

trigger:
  branches:
    include:
      - main
      - release/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  solution: 'Contoso.Invoicing.Legacy.sln'
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 8 SDK'
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  - script: dotnet restore $(solution)
    displayName: 'Restore'

  - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore
    displayName: 'Build'

  - script: dotnet test $(solution) --configuration $(buildConfiguration) --no-build --logger trx
    displayName: 'Test'
