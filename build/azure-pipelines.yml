# Contoso.Invoicing Build Pipeline
# .NET 8 on Ubuntu

trigger:
  branches:
    include:
      - main
      - release/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  solution: 'Contoso.Invoicing.Legacy.sln'
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 8 SDK'
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  - script: dotnet restore $(solution)
    displayName: 'Restore NuGet Packages'

  - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore
    displayName: 'Build Solution'

  - script: dotnet test $(solution) --configuration $(buildConfiguration) --no-build
    displayName: 'Run Tests'
